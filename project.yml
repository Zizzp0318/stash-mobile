# XcodeGen 工程定义 —— 仓库里只存这份 YAML，不存 .xcodeproj。
#
# 为什么：Windows 上根本打不开 .xcodeproj（二进制 plist），也无法合并冲突；
# 而 CI 用 macos runner 里的 `xcodegen generate` 一条命令就能生成等价工程。
# 于是「在 Windows 上写 iOS App」这件事变得可行：源码用文本编辑器写，工程由 YAML 描述。
#
# 本地（有 Mac 时）：brew install xcodegen && xcodegen generate && open StashMobile.xcodeproj
# CI：见 .github/workflows/ios.yml

name: StashMobile

options:
  bundleIdPrefix: com.zizzp
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # 侧载不需要签名，CI 里会显式覆盖；这里留空避免 XcodeGen 生成冲突的签名配置
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"

targets:
  StashMobile:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # 图标资源。必须显式列出：上面只收了 Sources/，Assets.xcassets 不会被自动带上，
      # 漏了这行的表现是「装上去还是空白图标」，而构建完全成功、没有任何报错。
      - path: Resources/Assets.xcassets
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.zizzp.stashmobile
        PRODUCT_NAME: Stash
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # 只做 iPhone：横屏、iPad 分栏在这个「看素材」的场景里没有收益，反而多一堆布局分支
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        SWIFT_STRICT_CONCURRENCY: minimal
    # ⚠️ 刻意**不用** XcodeGen 的 `info:` 块：它会按 properties 反向生成 Info.plist，
    #    把仓库里手写的那份（含 NSAppTransportSecurity / NSLocalNetworkUsageDescription）覆盖掉。
    #    这里只通过 INFOPLIST_FILE 指向手写文件，让它保持唯一真相源。
